worker_processes 1; # Minimal for lightweight operation
events {
    worker_connections 1024;
}

http {
    server_tokens off;
    lua_package_path "/usr/local/openresty/lualib/?.lua;;"; # Include Lua scripts

    limit_req_zone $binary_remote_addr zone=perip:10m rate=2r/s;

    # Keep request bodies small and fully in memory: ngx.req.get_body_data()
    # returns nil for bodies spooled to disk, so the buffer must cover every
    # accepted body or the filter cannot inspect it. Larger bodies get a 413.
    client_max_body_size 4k;
    client_body_buffer_size 4k;

    # Shared fail-closed JSON-RPC method filter, used by every proxied location.
    init_by_lua_block {
        local cjson = require "cjson.safe"

        local allowed_methods = {
            getSlot = true,
            getHighestSnapshotSlot = true,
            getVersion = true
        }

        function rpc_filter()
            local http_method = ngx.req.get_method()

            -- GET/HEAD carry no JSON-RPC payload; GET serves snapshot
            -- downloads, their redirects, and /health.
            if http_method == "GET" or http_method == "HEAD" then
                return
            end

            local function deny(message, id)
                ngx.status = 403
                ngx.header.content_type = "application/json"
                ngx.say(cjson.encode({
                    jsonrpc = "2.0",
                    error = { code = -32601, message = message },
                    id = id or cjson.null
                }))
                return ngx.exit(ngx.HTTP_FORBIDDEN)
            end

            if http_method ~= "POST" then
                return deny("HTTP method not allowed")
            end

            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                -- Missing body, or one nginx spooled to disk: never proxy
                -- a request whose payload was not inspected.
                return deny("Request body required")
            end

            local json = cjson.decode(body)
            if type(json) ~= "table" then
                return deny("Invalid JSON")
            end
            if json[1] ~= nil then
                return deny("Batch requests not allowed")
            end
            if type(json.method) ~= "string" or not allowed_methods[json.method] then
                return deny("Method not allowed", json.id)
            end
        end
    }

    upstream solana_validator {
        server 127.0.0.1:8899; # Solana validator RPC port
    }

    server {
        listen 18899;
        server_name localhost;
        more_set_headers 'Server: None';

        # Proxy version endpoint, served statically by nginx (never proxied).
        # Lets operators track the deployed proxy version across a fleet.
        # Bump the version whenever this config changes behavior.
        location = /jag-snap/version {
            default_type application/json;
            return 200 '{"name":"jag-snap","version":"1.1.0"}\n';
        }

        # RPC filtering for getSlot + getHighestSnapshotSlot + getVersion
        location / {
            limit_req zone=perip burst=1 nodelay;
            limit_req_status 429;

            access_by_lua_block {
                rpc_filter()
            }
            proxy_pass http://solana_validator; # Points to 127.0.0.1:8899
            proxy_set_header Host $host;
            proxy_buffering off; # Stream large downloads instead of spooling to disk
        }

        # Snapshot proxy (optional separate path); same filter so POSTed
        # JSON-RPC cannot bypass the allowlist through this location.
        location /snapshot {
            access_by_lua_block {
                rpc_filter()
            }
            proxy_pass http://solana_validator; # Points to 127.0.0.1:8899
            proxy_set_header Host $host;
            proxy_buffering off; # Stream large downloads instead of spooling to disk
        }
    }
}
